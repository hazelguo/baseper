<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Audio waveform bars representing speech/transcription -->
  <g fill="white">
    <!-- Left group of bars (speech input) -->
    <rect x="96" y="206" width="28" height="100" rx="14"/>
    <rect x="140" y="156" width="28" height="200" rx="14"/>
    <rect x="184" y="176" width="28" height="160" rx="14"/>
    <rect x="228" y="136" width="28" height="240" rx="14"/>
    <!-- Center bar (tallest - core) -->
    <rect x="272" y="116" width="28" height="280" rx="14"/>
    <!-- Right group of bars (text output) -->
    <rect x="316" y="146" width="28" height="220" rx="14"/>
    <rect x="360" y="186" width="28" height="140" rx="14"/>
    <rect x="404" y="166" width="28" height="180" rx="14"/>
  </g>
</svg>
